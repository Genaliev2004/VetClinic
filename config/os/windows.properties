# =====================================================================
# Настройки ВетКлиник, специфичные для Windows.
# Читаются раньше config/db.properties (значения из db.properties важнее).
# =====================================================================

# SQL Server на Windows — вход под текущей учётной записью Windows
mssql.integratedSecurity=true

# Внешний вид: system — родной вид Windows
ui.lookAndFeel=system
ui.fontName=Segoe UI
ui.fontSize=13
# масштаб интерфейса берёт на себя Windows (параметр «Масштаб» в настройках экрана)
ui.scale=

# Куда сохранять счета, разделитель строк и кодировка текстовых файлов
export.dir=${user.home}/Documents
export.lineSeparator=CRLF
export.charset=UTF-8
