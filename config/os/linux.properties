# =====================================================================
# Настройки ВетКлиник, специфичные для Linux.
# Читаются раньше config/db.properties (значения из db.properties важнее).
# =====================================================================

# Windows-аутентификация SQL Server в Linux недоступна — только логин/пароль
mssql.integratedSecurity=false

# Родной GTK-вид в Java часто выглядит неаккуратно, поэтому Nimbus
ui.lookAndFeel=nimbus
# шрифт с кириллицей, который есть почти в любом дистрибутиве
ui.fontName=DejaVu Sans
ui.fontSize=12
# масштаб для экранов высокой чёткости (пусто — не менять), например 1.5
ui.scale=

export.dir=${user.home}
export.lineSeparator=LF
export.charset=UTF-8
