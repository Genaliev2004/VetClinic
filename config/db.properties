# =====================================================================
# ВетКлиник — параметры подключения к базе данных.
#
# Порядок чтения настроек (каждый следующий источник важнее):
#   1. config/os/<windows|linux|macos>.properties — настройки, зависящие от ОС;
#   2. config/db.properties                      — этот файл;
#   3. config/local.properties                   — личные настройки (в git не попадает);
#   4. параметры JVM: java -Ddb.active=mssql -jar vetclinic.jar
# В значениях можно использовать ${user.home} и другие системные свойства Java.
# =====================================================================

# Активная СУБД по умолчанию: postgresql или mssql
# (при запуске её можно сменить в окне выбора роли)
db.active=postgresql

# Список профилей, которые показываются в окне выбора
db.profiles=postgresql,mssql

# --------------------------- PostgreSQL ------------------------------
postgresql.title=PostgreSQL
postgresql.driver=org.postgresql.Driver
postgresql.url=jdbc:postgresql://localhost:5432/vet_clinic
postgresql.user=vet_app
postgresql.password=VetApp_2026

# ------------------------ Microsoft SQL Server -----------------------
# Способ входа задаёт mssql.integratedSecurity в config/os/*.properties:
#   true  — Windows-аутентификация (user/password не используются,
#           нужна библиотека mssql-jdbc_auth-*.dll, её кладёт сборка в app/target/native);
#   false — SQL-аутентификация (нужен смешанный режим и логин из sql/mssql/00_create_database.sql).
mssql.title=Microsoft SQL Server
mssql.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
mssql.url=jdbc:sqlserver://localhost:1433;databaseName=vet_clinic;encrypt=true;trustServerCertificate=true
mssql.user=vet_app
mssql.password=VetApp_2026
